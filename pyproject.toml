[project]
name = "activity-pilot"
version = "0.1.0"
description = "Run a simulated student against an assignment template with Claude Code, and measure the run."
requires-python = ">=3.11"
dependencies = ["claude-agent-sdk==0.2.159"]

[project.scripts]
pilot = "pilot.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
